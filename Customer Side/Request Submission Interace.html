<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Request Submission Interface </title>
    <meta name="author" content="Maurice" >
    <link rel="stylesheet" href="requestpopup.css">
   <!--  <script src="script.js" defer></script> -->
    </head>
    <body>
        <main>
            <section id="request-popup">
                <form id="request">
                    <h1> Submit a Request</h1>
                    <div id="category">

                        <div class="select-wrapper">
                            <select id="request-category" name="category" required>
                                <option value="" disabled selected>Choose a category</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Repair">Repair</option>
                                <option value="Installation">Installation</option>
                            </select>

                            <span class="chevron" aria-hidden="true"></span>
                        </div>
                    </div>

                    <input type="text" placeholder="Subject" minlength="10" maxlength="50" id="request-subject" required>

                <textarea placeholder="Describe your issue" minlength="20" maxlength="300" 
                id="request-description"  required></textarea>

                <input type="submit" value="Submit Request" id="request-submit">
                </form>
                
            </section>
        </main>
    </body>
</html>
