<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Main Request Page </title>
    <meta name="author" content="Maurice" >
    <link rel="stylesheet" href="CSS/customer-request-main.css">
    <link rel="stylesheet" href="CSS/requestpopup.css">
    <link rel="stylesheet" href="CSS/details-popup.css">
    <script type="module" src="main.js" ></script>
    </head>
    <body>
        <main>
            <section id="Header">
                <h1>Your Requests</h1>
                <hr>
            </section>

            <section id="requests"> <!-- Has to be scrollable + js has to add requests-->    
            </section>
             <div class="button-wrapper">
                    <button value="Create Request" name="Create Request" id="request-creator">Create Request</button> 
                    <span class="Plus" aria-hidden="true"></span>
                </div>

            <dialog id="request-popup">
                <form action="" method="get" id="request">
                    <div class="popup-heading">
                        <h1> Submit a Request</h1>
                        <button type="button" id="modal-close"
                            aria-label="Close dialog">&times;
                        </button>
                    </div>
                    <div id="category">

                        <div class="select-wrapper">
                            <select id="request-category" name="category" required>
                                <option value="" disabled selected>Choose a category</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Repair">Repair</option>
                                <option value="Installation">Installation</option>
                            </select>

                            <span class="chevron" aria-hidden="true"></span>
                        </div>
                    </div>

                    <input type="text" placeholder="Subject" name="subject" minlength="10" maxlength="40" id="request-subject" required>

                    <textarea placeholder="Describe your issue" name="description" minlength="20" maxlength="300" 
                    id="request-description"  required></textarea>

                    <input type="submit" value="Submit Request" id="request-submit">
                    <!-- Inputs need a name or they will be ignored-->
                </form>

            </dialog>

        </main>

          <template id="request-template">
                    <div class="request-wrapper">
                        <div class="request-info">
                            <div class="request-heading">
                            <h3 class="request-subject"></h3>
                            <span class="request-date"></span>
                            </div>
                            <span class="request-category"></span>
                        </div>


                        <div class="request-actions">
                            <span class="request-status">Pending</span>

                            <button class="view-details" id="modal-btn" data-request-id="">View Details</button>
                            <span class="Arrow" aria-hidden="true"></span>
                        </div>
                    </div>
                </template>    


                
                <template id="details-template">

                    <dialog class="details-popup">
                        <div class="details-major">
                            <div class="details-text">
                        <h2 class="details-subject">Rectangular </h2>
                        <span class="details-category">Repair</span>
                            </div>
                            <div class="details-description-wrapper">
                                <p class="details-description"></p>
                            </div>
                    
                        </div>

                <div class="details-minor">
                    <div class="details-id-wrapper">
                        <span class="details-id">ID:</span>
                        <span class="details-id-value"></span>                        
                    </div>
                    <div class="details-status-wrapper">
                        <span class="details-status-name">Status:</span>
                        <span class="details-status"></span>
                    </div>

                    <div class="details-date-wrapper">
                        <span class="details-subdate">Submission Date:</span>
                        <span class="details-date"></span>
                    </div>
                 
                    <button class="details-cancel">Cancel Request</button>
                </div>

                

                    </dialog>

                </template>
     
    </body>
</html>
