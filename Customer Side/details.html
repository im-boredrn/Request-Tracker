<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title> Main Request Page </title>
        <meta name="author" content="Maurice" >
        <link rel="stylesheet" href="CSS/details-popup.css">
    </head>
    <body>
        <main>

            <section id="details-popup">
                <div class="details-major">
                    <div class="details-text">
                        <h2 class="details-subject">Rectangular </h2>
                        <span class="details-category">Repair</span>
                    </div>
                    <div class="details-description-wrapper">

                    </div>
                    
                </div>

                <div class="details-minor">
                    <div class="details-id-wrapper">
                        <span class="details-id">ID:</span>
                        <span class="details-id-value">0516596</span>                        
                    </div>
                    <div class="details-status-wrapper">
                        <span class="details-status">Status:</span>
                        <span class="details-status-value">Pending</span>
                    </div>

                    <div class="details-date-wrapper">
                        <span class="details-subdate">Submission Date:</span>
                        <span class="details-date">10/12/20</span>
                    </div>
                 
                    <button class="details-cancel">Cancel Request</button>
                </div>

            </section>
        </main>
    </body>

</html>
