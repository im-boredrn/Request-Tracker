<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Request Submission Interface </title>
    <meta name="author" content="Maurice" >
    <link rel="stylesheet" href="requestpopup.css">
   <!--  <script src="script.js" defer></script> -->
    </head>
    <body>
        <main>
            <section id="request-popup">
                <form id="request">
                    <div id="category">
                    <label for="request-category">Request Category:</label>
                    <select id="request-category" name="request category">
                        <option value="Maintenance">Maintenance</option>
                        <option value="Repair">Repair</option>
                        <option value="Installation">Installation</option>
                    </select>
                </div>

                <input type="text" placeholder="Describe your problem" min="20" maxlength="300" 
                id="request-description">

                <input type="submit" value="Submit Request" id="request-submit">
                </form>
                
            </section>
        </main>
    </body>
</html>
